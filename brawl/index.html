  <script>
    window.gtag = () => {};

    (() => {
      const targetGame = /brawl\s*stars|action\s*#\s*02/i;
      const pageTitle = 'Brawl Stars';
      let loginRequested = false;
      const tryLaunch = () => {
        if (document.title !== pageTitle) document.title = pageTitle;
        const card = [...document.querySelectorAll('.game-card')]
          .find((element) => targetGame.test(element.textContent || ''));
        const playButton = card?.querySelector('.play-button');
        if (!playButton || playButton.disabled) return;

        const title = card.querySelector('.game-title');
        if (title && /action\s*#\s*02/i.test(title.textContent || '') &&
            !/brawl\s*stars/i.test(title.textContent || '')) {
          title.textContent = 'Brawl Stars (Action #02)';
        }
        card.querySelectorAll('img').forEach((image) => image.remove());

        const session = JSON.parse(localStorage.getItem('userData') || 'null');
        if (!session?.token) {
          if (!loginRequested) {
            loginRequested = true;
            playButton.click();
          }
          return;
        }

        const server = Number.parseInt(localStorage.getItem('selectedServer') || '0', 10);
        if (!Number.isInteger(server) || server <= 0) return;

        observer.disconnect();
        playButton.click();
      };
      const observer = new MutationObserver(tryLaunch);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      observer.observe(document.head, { childList: true, subtree: true, characterData: true });
      document.addEventListener('change', tryLaunch, true);
      document.addEventListener('click', (event) => {
        if (event.target.closest('.modal .close-button') ||
            event.target.matches('.modal-overlay')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      tryLaunch();
    })();
  </script>
